---
name: Build RPi Pico firmware image
"on":
  # Build on branch pushes. Tag pushes are handled by release.yaml, which
  # calls this workflow via workflow_call to avoid building twice.
  push:
    branches:
      - "**"
  workflow_call:

jobs:
  Build-Firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libffi-dev libusb-1.0-0-dev pkg-config \
            python3 python3-venv
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          # Full history + tags so 'git describe' can derive TONBERRY_VERSION
          fetch-depth: 0
      - name: Initialize submodules
        run: cd software && ./update-submodules.sh
      - name: Prepare venv
        run: python3 -m venv build-venv && source build-venv/bin/activate && pip install freezefs
      - name: Build
        run: source build-venv/bin/activate && cd software && ./build.sh
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-RPi-Pico-W
          # Exclude the filesystem images; they have their own artifact below.
          path: |
            software/build/firmware-*.uf2
            !software/build/firmware-filesystem-*.uf2
      - name: Upload firmware w/ filesystem
        uses: actions/upload-artifact@v4
        with:
          name: firmware-RPi-Pico-W-with-fs
          path: software/build/firmware-filesystem-*.uf2
