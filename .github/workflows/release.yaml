name: Publish firmware release
"on":
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  Verify-On-Main:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on the main branch." >&2
            echo "Refusing to publish a release for a tag that is not on main." >&2
            exit 1
          fi

  Build-Firmware:
    needs: Verify-On-Main
    uses: ./.github/workflows/build.yaml

  Publish-Release:
    needs: Build-Firmware
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        run: |
          mkdir -p release
          # Flatten the per-artifact subdirectories into a single directory.
          find artifacts -name '*.uf2' -exec cp -n {} release/ \;
          ls -l release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release/*.uf2
